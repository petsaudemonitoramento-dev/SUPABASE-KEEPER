name: Validate Keeper

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Save generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

      - name: Build result
        if: always()
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"

  sync-lockfile:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download lockfile
        uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: .

      - name: Commit lockfile when changed
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "supabase-keeper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push

# Falhas do build não geram uma rotina de alerta do Keeper.
# O keep-alive de produção roda na Vercel e registra falhas somente no painel.
